<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 220 220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Typed boundaries between React and API</title>
  <desc id="desc">Burgundy grid with two overlapping boundaries connected by a thin line.</desc>
  <defs>
    <clipPath id="round"><rect width="220" height="220" rx="24"/></clipPath>
    <pattern id="grid" width="36.5" height="36.5" patternUnits="userSpaceOnUse">
      <path d="M36.5 0H0V36.5" stroke="#6a303f" stroke-opacity=".3" stroke-width=".65"/>
    </pattern>
  </defs>
  <g clip-path="url(#round)">
    <rect width="220" height="220" fill="#310f1b"/>
    <rect width="220" height="220" fill="url(#grid)"/>
    <rect x="37" y="74" width="74" height="74" rx="4" fill="#7b354a" fill-opacity=".17" stroke="#b67b8b" stroke-opacity=".48" stroke-width=".8"/>
    <rect x="110" y="111" width="73" height="37" rx="2" stroke="#bc788c" stroke-opacity=".5" stroke-width=".75" stroke-dasharray="2.2 2.2"/>
    <path d="M73 111L147 130" stroke="#ddb0bd" stroke-width=".9" stroke-linecap="round"/>
    <circle cx="73" cy="111" r="2.6" fill="#dda9b8"/>
    <circle cx="147" cy="130" r="1.8" fill="#f5dfe5"/>
  </g>
  <rect x=".6" y=".6" width="218.8" height="218.8" rx="23.4" stroke="#62424d" stroke-opacity=".7" stroke-width="1.2"/>
</svg>
